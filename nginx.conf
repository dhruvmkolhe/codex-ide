# Rate limiting zone — applied to the external API proxy
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/m;

server {
    listen 80;
    server_name localhost;
    absolute_redirect off;

    # ── Security Headers ────────────────────────────────────────
    # Content Security Policy (Disabled for local CDN compatibility)
    # add_header Content-Security-Policy "...";
    
    # Prevent clickjacking attacks
    add_header X-Frame-Options "SAMEORIGIN" always;
    
    # Prevent MIME type sniffing
    add_header X-Content-Type-Options "nosniff" always;
    
    # Control referrer information
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Prevent Adobe Flash/PDF policies
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    
    # XSS Protection (legacy browsers)
    add_header X-XSS-Protection "1; mode=block" always;

    root /usr/share/nginx/html;

    # Redirect root to /homepage
    location = / {
        return 302 /homepage;
    }

    # Landing page
    location = /homepage {
        try_files /home.html =404;
    }

    # Docs section
    location /docs {
        try_files /docs.html =404;
    }

    # Community section
    location /community {
        try_files /community.html =404;
    }

    # Blog section
    location /blog {
        try_files /blog.html =404;
    }

    # React IDE
    location /ide {
        alias /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # Ensure static assets are served from root
    location /static/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Enforce Content-Disposition and nosniff for downloadable attachments (VULN-019)
    location ~* \.(json|vcf|csv|zip)$ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Disposition "attachment" always;
        try_files $uri =404;
    }

    # General fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security disclosure information (RFC 9116)
    location /.well-known/security.txt {
        default_type text/plain;
        add_header Content-Type "text/plain; charset=utf-8";
    }

    # Proxy AI requests to the backend service
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://backend:5001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

}
