# Rate limiting zone — applied to the external API proxy
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/m;

server {
    listen 80;
    server_name localhost;
    absolute_redirect off;

    # ── Security Headers ──────────────────────────────────────────────────────
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com https://db.onlinewebfonts.com; connect-src 'self' https://*.supabase.co https://api.onecompiler.com; img-src 'self' data: blob: https://www.gstatic.com https://cdn.jsdelivr.net; frame-ancestors 'none'; object-src 'none';" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    root /usr/share/nginx/html;

    # Redirect root to /homepage
    location = / {
        return 302 /homepage;
    }

    # Landing page
    location = /homepage {
        try_files /home.html =404;
    }

    # Docs section
    location /docs {
        try_files /docs.html =404;
    }

    # Community section
    location /community {
        try_files /community.html =404;
    }

    # Blog section
    location /blog {
        try_files /blog.html =404;
    }

    # React IDE
    location /ide {
        alias /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # Ensure static assets are served from root
    location /static/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # General fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy AI requests to the backend service
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://backend:5001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxy API requests with rate limiting to prevent key abuse
    location /v1/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass https://api.onecompiler.com/v1/;
        proxy_ssl_server_name on;
        proxy_set_header Host api.onecompiler.com;
        proxy_set_header X-Real-IP $remote_addr;
        # Strip the API key header from responses for safety
        proxy_hide_header Authorization;
    }
}
